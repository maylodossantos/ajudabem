spring.application.name=api

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ajudabem}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:ajudabem}
spring.datasource.password=${DB_PASSWORD:ajudabem}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

api.security.token.secret=${JWT_SECRET:D5A7CpwgEq82QEFxz6856QM0}

# Comma-separated list of origins the Flutter web build may call this API from.
# Add your machine's LAN IP here (e.g. http://192.168.1.10:4200) to test from a phone on the same Wi-Fi.
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Defaults point at a local fake-SMTP catcher (e.g. MailDev) for dev; override via env vars in prod.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
api.mail.from=${MAIL_FROM:no-reply@ajudabem.com}

# Local LLM (Ollama) used to triage the risk level of assisted people. While
# it isn't running, people just stay pending (no risk level) until it is.
api.ollama.url=${OLLAMA_URL:http://localhost:11434}
api.ollama.model=${OLLAMA_MODEL:qwen2.5:3b}
# How often pending people (no risk level yet) are triaged.
api.triage.interval-ms=${TRIAGE_INTERVAL_MS:60000}
