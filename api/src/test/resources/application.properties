spring.application.name=api

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

api.security.token.secret=test-secret

api.cors.allowed-origins=http://localhost:4200

spring.mail.host=localhost
spring.mail.port=1025
api.mail.from=no-reply@ajudabem.com

# Nothing listens here in tests, so a triage attempt just fails fast.
api.ollama.url=http://localhost:1
api.ollama.model=qwen2.5:3b
# Keeps the scheduled triage from running during tests.
api.triage.interval-ms=3600000
api.geocoding.url=http://localhost:1
