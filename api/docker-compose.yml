services:
  db:
    image: postgres:16-alpine
    container_name: ajudabem-db
    environment:
      POSTGRES_DB: ${DB_NAME:-ajudabem}
      POSTGRES_USER: ${DB_USER:-ajudabem}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ajudabem}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ajudabem-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ajudabem} -d ${DB_NAME:-ajudabem}"]
      interval: 5s
      timeout: 5s
      retries: 10

  maildev:
    image: maildev/maildev
    container_name: ajudabem-maildev
    ports:
      - "${MAILDEV_SMTP_PORT:-1025}:1025"
      - "${MAILDEV_WEB_PORT:-1080}:1080"

volumes:
  ajudabem-db-data:
